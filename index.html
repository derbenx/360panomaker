<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>360 Photo Composer</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #container { width: 100vw; height: 100vh; }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0,0,0,0.5);
        }
        #startButton {
            padding: 20px 40px;
            font-size: 24px;
            cursor: pointer;
        }
        #camera-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 3px solid white;
            border-radius: 0; /* Make it a square */
            overflow: hidden;
            z-index: 10;
            display: none; /* Hidden until started */
            opacity: 0.4; /* 60% transparent */
        }
        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #save-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        #saveButton {
            padding: 20px 40px;
            font-size: 24px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="camera-container">
        <video id="camera-feed" autoplay playsinline muted></video>
    </div>
    <div id="container"></div>
    <div id="overlay">
        <button id="startButton">Start</button>
    </div>
    <div id="save-container" style="display: none;">
        <button id="saveButton">Save Photo</button>
    </div>

    <script src="libs/three.min.js"></script>
    <script src="libs/DeviceOrientationControls.js"></script>
    <script src="script.js"></script>
</body>
</html>
